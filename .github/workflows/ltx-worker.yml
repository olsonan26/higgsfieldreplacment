name: Publish LTX worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runpod/ltx-2.5-worker/**"
      - ".github/workflows/ltx-worker.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ltx-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/ltx-2.5-worker
          file: runpod/ltx-2.5-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vesperframe-ltx25-worker:latest
            ghcr.io/${{ github.repository_owner }}/vesperframe-ltx25-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
